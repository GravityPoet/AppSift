name: AppSift
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0
options:
  bundleIdPrefix: com.gravitypoet
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    # Local builds use a stable project-specific identity created by
    # scripts/ensure-local-codesign-cert.sh. CI disables signing explicitly;
    # only the future certificate-migration workflow overrides this identity.
    CODE_SIGN_IDENTITY: "AppSift Local Code Signing"
    CODE_SIGN_STYLE: "Manual"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGN_ENTITLEMENTS: "AppSift/AppSift.entitlements"
    INFOPLIST_FILE: "AppSift/Info.plist"
    PRODUCT_BUNDLE_IDENTIFIER: "com.gravitypoet.appsift"
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "8"
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    COMBINE_HIDPI_IMAGES: "YES"
    # Build/test products must not compete with the canonical installed app in
    # LaunchServices. scripts/install-local.sh registers /Applications/AppSift.app
    # explicitly after its atomic replacement and signature verification.
    REGISTER_WITH_LAUNCH_SERVICES: "NO"

targets:
  AppSift:
    type: application
    platform: macOS
    sources:
      - AppSift
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: AppSift
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  AppSiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppSiftTests
    dependencies:
      - target: AppSift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ""
  AppSiftUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - AppSiftUITests
    dependencies:
      - target: AppSift
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.gravitypoet.appsift.uitests
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  AppSift:
    build:
      targets:
        AppSift: all
        AppSiftTests: [test]
    test:
      targets:
        - name: AppSiftTests
  AppSiftAccessibility:
    build:
      targets:
        AppSift: all
        AppSiftUITests: [test]
    test:
      targets:
        - name: AppSiftUITests
      environmentVariables:
        APPSIFT_AX_VERIFIED_MACOS15_OPAQUE_TEXT_BUG: "YES"
